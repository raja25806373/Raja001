<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mines Hack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background: black;
      color: white;
    }
    .login, .mines-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    .login {
      background: linear-gradient(45deg, darkred, black);
    }
    input {
      padding: 10px;
      font-size: 18px;
      background: black;
      color: red;
      border: 2px solid red;
      outline: none;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      background: red;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .mines-page {
      display: none;
      flex-direction: column;
    }
    .title {
      font-size: 32px;
      font-weight: bold;
      animation: glitch 1.5s infinite;
      text-shadow: 0 0 5px red, 0 0 10px red;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 2px red; }
      20% { text-shadow: -2px -2px red; }
      40% { text-shadow: 2px -2px red; }
      60% { text-shadow: -2px 2px red; }
      80% { text-shadow: 2px 2px red; }
      100% { text-shadow: -2px -2px red; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-gap: 10px;
      margin-top: 30px;
    }
    .box {
      width: 60px;
      height: 60px;
      background: linear-gradient(green, black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #0f0;
      position: relative;
    }
    .safe {
      animation: neonGlow 1.5s infinite alternate;
    }
    @keyframes neonGlow {
      from {
        box-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
      }
      to {
        box-shadow: 0 0 15px #0f0, 0 0 20px #0f0;
      }
    }
    .unsafe {
      animation: explosion 0.5s ease-out forwards;
    }
    @keyframes explosion {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .show-safe-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: red;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="login" id="loginPage">
  <h1>Hint: Enter Password</h1>
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()">Submit</button>
</div>

<div class="mines-page" id="minesPage">
  <div class="title">RAJA001</div>
  <div class="grid" id="grid"></div>
  <button class="show-safe-btn" onclick="showSafeMines()">Show Safe Mines</button>
</div>

<script>
  const password = "RAJA";

  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    if (input === password) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('minesPage').style.display = 'flex';
      generateGrid();
      autoReset();
    } else {
      alert("Incorrect Password!");
    }
  }

  const gridElement = document.getElementById('grid');
  let safeIndexes = [];

  function generateGrid() {
    gridElement.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.onclick = () => checkMine(i, box);
      gridElement.appendChild(box);
    }
    generateSafeMines();
  }

  function generateSafeMines() {
    safeIndexes = [];
    while (safeIndexes.length < 6) {
      let rand = Math.floor(Math.random() * 25);
      if (!safeIndexes.includes(rand)) {
        safeIndexes.push(rand);
      }
    }
  }

  function checkMine(index, box) {
    if (safeIndexes.includes(index)) {
      box.classList.add('safe');
      box.innerHTML = '✅';
    } else {
      box.classList.add('unsafe');
      box.innerHTML = '❌';
    }
  }

  function showSafeMines() {
    const boxes = document.querySelectorAll('.box');
    boxes.forEach((box, i) => {
      if (safeIndexes.includes(i)) {
        box.classList.add('safe');
        box.innerHTML = '✅';
      } else {
        box.classList.add('unsafe');
        box.innerHTML = '❌';
      }
    });
  }

  function autoReset() {
    setInterval(() => {
      generateGrid();
    }, 10000); // Reset every 10 seconds
  }
</script>

</body>
</html>
